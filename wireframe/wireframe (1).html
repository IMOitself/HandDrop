<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { position: relative; display: flex; flex-direction: column; border: 1px solid #888; overflow: hidden; font: 12px sans-serif; color: #666; }
  /* wide screens */
  @media (min-aspect-ratio: 3/4) { html { padding: 0 calc(100vw / 6) } }

  /* gray = content, orange = padding */
  div { display: flex; align-items: center; justify-content: center; border: 1px dashed #999;
        background: linear-gradient(#eee, #eee) content-box, #f9d9c4; }
  .b  { background: linear-gradient(#ddd, #ddd) content-box, #f9d9c4; }
  .c  { align-items: stretch; padding: 6px; gap: 6px; }
  .col { flex-direction: column; }
  .sm { flex: none; }

  .toolbar { height: 8%; }
  .tabs    { height: 6%; }
  .tabs .b, .toolbar .b { flex: 1; }
  .toolbar .title { flex: 4; }

  .main   { flex: 1; min-height: 0; }
  .drawer { flex:1; overflow: hidden; }
  .drawer .mini { height: 36px; flex: none; }
  .drawer .item { height: 40px; flex: none; }
  .editor { flex: 1; padding: 12px 12px calc(30vh + 12px); }
  .phone  { height: 100%; aspect-ratio: 9 / 16; flex: none; }

  .sheet  { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: 2; }
  .head   { height: 22%; flex: none; }
  .head .label { flex: 1; }
  .stabs  { height: 20%; flex: none; }
  .stabs .b { flex: none; width: 70px; }
  .row    { flex: 1; min-height: 0; position: relative; padding: 0; }
  .scroll { flex: 1; overflow-x: auto; justify-content: flex-start; }
  .scroll .b { flex: none; width: 26%; }
  .all    { position: absolute; right: 6px; top: 6px; bottom: 6px; width: 26%; z-index: 3; }
</style>
</head>
<body>

<div class="toolbar c">
  <div class="b">Back</div>
  <div class="b title">Title</div>
  <div class="b">Undo</div>
  <div class="b">Redo</div>
  <div class="b">Save</div>
  <div class="b">Menu</div>
</div>

<div class="tabs c">
  <div class="b">Tab</div>
  <div class="b">Tab</div>
  <div class="b">Tab</div>
</div>

<div class="main c">
  <div class="drawer c col">
    <div class="mini c"><div class="b" style="flex:1">Tab</div><div class="b" style="flex:1">Tab</div></div>
    <div class="b item">Item</div>
    <div class="b item">Item</div>
    <div class="b item">Item</div>
    <div class="b item">Item</div>
    <div class="b item">Item</div>
    <div class="b item">Item</div>
    <div class="b item">Item</div>
  </div>
  <div class="editor c">
    <div class="phone">Phone layout</div>
  </div>
</div>

<div class="sheet c col">
  <div class="head c">
    <div class="b sm" style="width:36px">Icon</div>
    <div class="b label">Header</div>
    <div class="b sm" style="width:36px">Save</div>
  </div>
  <div class="stabs c">
    <div class="b">Tab</div>
    <div class="b">Tab</div>
    <div class="b">Tab</div>
  </div>
  <div class="row">
    <div class="scroll c">
      <div class="b">Item</div>
      <div class="b">Item</div>
      <div class="b">Item</div>
      <div class="b">Item</div>
      <div class="b">Item</div>
      <div class="b">Item</div>
    </div>
    <div class="b all">See all</div>
  </div>
</div>

</body>
</html>
